<title>HoloSpot — Colour, Light & Logic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050816}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#eaf3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:100%;flex:1;display:grid;place-items:center;padding:14px 14px 2px}
img{display:block;width:min(100%,1536px);height:auto;max-height:calc(100svh - 84px);object-fit:contain}
footer{width:100%;display:flex;justify-content:center;gap:24px;padding:10px 16px max(14px,env(safe-area-inset-bottom));font-size:13px;letter-spacing:.03em}
a{color:#b7c7ee;text-decoration:none;transition:color .2s}a:hover,a:focus-visible{color:#69e6ff;text-decoration:underline;text-underline-offset:4px}
@media(max-width:600px){main{padding:0 8px}img{max-height:calc(100svh - 64px)}footer{padding-top:8px;font-size:12px}}
